name: "NowSecure Mobile SBOM"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 1 * * 2'

permissions:
  contents: read

jobs:
  nowsecure:
    name: NowSecure Mobile SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check NowSecure prerequisites
        id: prerequisites
        shell: bash
        env:
          NS_TOKEN: ${{ secrets.NS_TOKEN }}
        run: |
          if [[ -x ./gradlew && -n "${NS_TOKEN:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NowSecure scan skipped: this repository does not include the required mobile build inputs or NS_TOKEN is unset."
          fi

      - name: Build your application
        if: steps.prerequisites.outputs.enabled == 'true'
        run: ./gradlew assembleDebug

      - name: NowSecure upload app
        if: steps.prerequisites.outputs.enabled == 'true'
        uses: nowsecure/nowsecure-sbom-action@ecb731b6f17a83fa53f756f9dae2ec7034c5ed7c
        with:
          token: ${{ secrets.NS_TOKEN }}
          app_file: app-debug.apk
          group_id: ${{ vars.NOWSECURE_GROUP_ID }} 
